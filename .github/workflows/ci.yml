name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Test CMS workflows
        run: npm test

      - name: Lint changelog
        run: npm run changelog:lint

      - name: Build
        run: npm run build
        env:
          # No delivery token in CI: pages render from the seed stories in storyblok/
          STORYBLOK_VERSION: draft

      - name: Check generated Storyblok types
        run: npm run storyblok:types:check

      - name: Smoke-test the built site
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          npm run smoke -- http://localhost:3000 || { cat next-start.log; exit 1; }
          npm run verify:agent-readiness -- http://localhost:3000 || { cat next-start.log; exit 1; }
          node scripts/verify-browser.mjs http://localhost:3000 || { cat next-start.log; exit 1; }

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-review
          path: .next/review/
          if-no-files-found: ignore
