name: Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check links in docs, llms.txt, and seed stories
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --no-progress
            --exclude-loopback
            --exclude '^https://nextstory\.marcopontili\.com/api/'
            --exclude '^https://(www\.)?linkedin\.com/'
            --exclude '^https://(www\.)?unsplash\.com/'
            --accept 200,206,429
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md
            'docs/**/*.md' public/llms.txt 'storyblok/stories/*.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
