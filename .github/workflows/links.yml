name: Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links in docs, llms.txt, and seed stories
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --exclude-loopback
            --exclude '^https://nextstory\.marcopontili\.com/api/'
            --exclude '^https://(www\.)?linkedin\.com/'
            --accept 200,206,429
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
            'docs/**/*.md' public/llms.txt 'storyblok/stories/*.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
